<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="a robed wizard conjuring a receding line of apprentice wizards from arcane light">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05040c"/>
      <stop offset="0.45" stop-color="#0e0a22"/>
      <stop offset="0.8" stop-color="#1b1138"/>
      <stop offset="1" stop-color="#251746"/>
    </linearGradient>
    <radialGradient id="nebula" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.30"/>
      <stop offset="0.5" stop-color="#4c1d95" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#4c1d95" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#ede9fe"/>
      <stop offset="0.6" stop-color="#c4b5fd" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#7c3aed" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robeMain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#120d24"/>
      <stop offset="0.6" stop-color="#1d1535"/>
      <stop offset="0.86" stop-color="#2e2152"/>
      <stop offset="1" stop-color="#4a3578"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6c8ff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="stream" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ede9fe" stop-opacity="0.9"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="wisp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#c4b5fd" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ede9fe" stop-opacity="0.65"/>
    </linearGradient>
    <radialGradient id="groundGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6cae" stop-opacity="0"/>
      <stop offset="1" stop-color="#7c6cae" stop-opacity="0.16"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.46" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.72" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="soft8" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft18" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- apprentice wizard silhouette ~110w × 230h: pointed hat, robe, staff -->
    <g id="apprentice">
      <!-- hat: drooping cone + brim -->
      <path d="M46,-4 C38,14 30,36 24,54 L78,54 C70,36 60,14 54,-6 C52,-12 48,-10 46,-4 Z" fill="#1c1336"/>
      <path d="M8,54 C40,46 66,46 96,54 C98,60 94,63 90,62 C62,55 40,55 14,62 C10,63 6,60 8,54 Z" fill="#241a44"/>
      <!-- head shadow under brim -->
      <path d="M36,62 C40,72 60,72 66,62 C56,59 46,59 36,62 Z" fill="#0b0716"/>
      <!-- robe -->
      <path d="M34,68 C18,104 8,158 4,228 C34,218 70,218 100,228 C96,158 86,104 70,68 C58,76 44,76 34,68 Z" fill="#170f2d"/>
      <!-- rim light on the side facing the caster (left) -->
      <path d="M34,68 C20,104 11,158 7,224 C13,160 22,108 36,72 Z" fill="#a78bfa" opacity="0.85"/>
      <path d="M24,54 C32,49 40,47 48,46 L44,52 C37,53 30,55 26,58 Z" fill="#a78bfa" opacity="0.7"/>
      <!-- staff -->
      <rect x="98" y="-10" width="3.2" height="236" rx="1.6" fill="#241a44"/>
      <circle cx="99.6" cy="-16" r="9" fill="url(#orbCore)"/>
    </g>
  </defs>

  <!-- ================= background ================= -->
  <rect width="1280" height="560" fill="url(#sky)"/>
  <ellipse cx="930" cy="170" rx="430" ry="240" fill="url(#nebula)"/>
  <ellipse cx="420" cy="100" rx="300" ry="170" fill="url(#nebula)" opacity="0.6"/>

  <!-- stars -->
  <g fill="#d8ccff">
    <circle cx="118" cy="64" r="1.5" opacity="0.75"/>
    <circle cx="236" cy="120" r="1.0" opacity="0.4"/>
    <circle cx="356" cy="46" r="1.2" opacity="0.55"/>
    <circle cx="520" cy="92" r="0.9" opacity="0.35"/>
    <circle cx="648" cy="36" r="1.4" opacity="0.6"/>
    <circle cx="790" cy="110" r="1.0" opacity="0.4"/>
    <circle cx="906" cy="52" r="1.3" opacity="0.6"/>
    <circle cx="1034" cy="128" r="0.9" opacity="0.35"/>
    <circle cx="1146" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="1232" cy="160" r="1.0" opacity="0.4"/>
    <circle cx="76" cy="200" r="0.9" opacity="0.3"/>
    <circle cx="1090" cy="232" r="0.8" opacity="0.3"/>
    <circle cx="560" cy="180" r="0.8" opacity="0.25"/>
  </g>

  <!-- ground plane -->
  <rect y="470" width="1280" height="90" fill="#0a0718"/>
  <ellipse cx="640" cy="474" rx="760" ry="40" fill="#120c26"/>
  <ellipse cx="330" cy="500" rx="330" ry="60" fill="url(#groundGlow)"/>

  <!-- ================= magic circle ================= -->
  <g opacity="0.9">
    <ellipse cx="320" cy="502" rx="168" ry="30" fill="none" stroke="#a78bfa" stroke-width="2.4" opacity="0.55" filter="url(#soft)"/>
    <ellipse cx="320" cy="502" rx="168" ry="30" fill="none" stroke="#e9d5ff" stroke-width="0.8" opacity="0.8"/>
    <ellipse cx="320" cy="502" rx="128" ry="22" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.45"/>
    <ellipse cx="320" cy="502" rx="196" ry="36" fill="none" stroke="#6d28d9" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- ================= root wizard ================= -->
  <!-- staff: straight, orb seated on top -->
  <g transform="rotate(2 427 320)">
    <rect x="423" y="124" width="7" height="396" rx="3.5" fill="#2a1f4e"/>
    <rect x="423" y="124" width="2.4" height="396" rx="1.2" fill="#5b46a0" opacity="0.8"/>
  </g>

  <!-- figure: three-quarter back view, facing the conjuration -->
  <g>
    <!-- body robe: shoulders, slight waist, hem flaring right -->
    <path d="M252,218
             C228,262 206,330 194,412
             C188,462 186,498 188,520
             C254,506 344,506 414,518
             C414,486 408,440 398,392
             C386,330 370,272 354,238
             C322,218 282,214 252,218 Z" fill="url(#robeMain)"/>
    <!-- cloak sweep behind (left), catching less light -->
    <path d="M252,222 C230,270 212,340 202,420 C198,462 196,496 198,516 L188,520 C186,496 188,460 194,412 C206,330 228,262 252,218 Z" fill="#0d0919"/>
    <!-- shoulders / neck mass -->
    <path d="M262,212 C272,196 296,188 318,192 C338,196 350,208 354,222 C322,210 286,208 262,212 Z" fill="#171029"/>
    <!-- hat: wide brim + tall drooping cone, tilted toward the orb -->
    <path d="M300,86
             C290,108 276,142 264,170
             L352,176
             C340,148 326,114 314,84
             C310,72 304,74 300,86 Z" fill="#1c1336"/>
    <path d="M306,86 C300,78 296,84 294,92 C290,80 296,68 304,70 C312,72 312,82 306,86 Z" fill="#1c1336"/>
    <path d="M232,170
             C280,156 330,158 384,176
             C388,186 382,192 374,190
             C328,176 282,174 242,184
             C234,186 228,178 232,170 Z" fill="#241a44"/>
    <!-- under-brim shadow -->
    <path d="M276,186 C286,200 322,202 336,190 C316,184 294,183 276,186 Z" fill="#0b0716"/>
    <!-- sleeve + extended arm gripping the staff -->
    <path d="M340,252
             C364,250 392,256 412,268
             C422,274 428,282 426,292
             C422,304 408,306 394,300
             C372,290 350,282 336,278
             C330,270 332,258 340,252 Z" fill="#1d1535"/>
    <ellipse cx="424" cy="284" rx="11" ry="9" fill="#3a2a66"/>
    <!-- robe fold shadows -->
    <g stroke="#0d0919" stroke-width="5" fill="none" opacity="0.75" stroke-linecap="round">
      <path d="M276,266 C260,334 250,414 246,502"/>
      <path d="M312,256 C306,334 304,422 308,506"/>
      <path d="M346,272 C356,334 366,424 374,508"/>
    </g>
    <g stroke="#241a44" stroke-width="2" fill="none" opacity="0.8" stroke-linecap="round">
      <path d="M289,268 C276,334 267,414 263,502"/>
      <path d="M329,262 C326,334 326,424 331,506"/>
    </g>
    <!-- rim light on the orb-facing contour -->
    <path d="M354,234
             C362,262 376,316 388,376
             C398,426 406,470 408,512
             C400,468 392,422 384,378
             C372,318 360,266 350,238 Z" fill="url(#rim)" filter="url(#soft)"/>
    <path d="M314,88 C324,112 336,144 348,174 L342,176 C330,146 318,114 308,90 Z" fill="#c4b5fd" opacity="0.75" filter="url(#soft)"/>
    <path d="M352,176 C364,178 376,182 384,178 L380,188 C370,190 358,186 350,182 Z" fill="#a78bfa" opacity="0.6" filter="url(#soft)"/>
    <path d="M398,262 C410,268 420,276 424,286 C416,278 406,272 396,268 Z" fill="#a78bfa" opacity="0.7" filter="url(#soft)"/>
  </g>

  <!-- staff orb -->
  <circle cx="430" cy="112" r="64" fill="url(#orbHalo)"/>
  <circle cx="430" cy="112" r="24" fill="url(#orbCore)"/>
  <circle cx="430" cy="112" r="8" fill="#ffffff" filter="url(#soft)"/>

  <!-- ================= conjuration streams (land on each apprentice) ================= -->
  <g fill="none" stroke-linecap="round">
    <path d="M452,118 C570,60 690,90 740,180 C772,238 788,300 792,332" stroke="url(#stream)" stroke-width="7" filter="url(#soft8)" opacity="0.85"/>
    <path d="M452,118 C570,60 690,90 740,180 C772,238 788,300 792,332" stroke="#e9d5ff" stroke-width="1.6" opacity="0.7"/>
    <path d="M454,128 C600,90 800,130 920,240 C956,282 976,344 982,376" stroke="url(#stream)" stroke-width="5" filter="url(#soft8)" opacity="0.6"/>
    <path d="M454,128 C600,90 800,130 920,240 C956,282 976,344 982,376" stroke="#d8ccff" stroke-width="1.1" opacity="0.5"/>
    <path d="M452,140 C620,140 880,200 1060,310 C1098,336 1126,378 1134,408" stroke="url(#stream)" stroke-width="3.6" filter="url(#soft8)" opacity="0.42"/>
  </g>

  <!-- ================= conjured apprentices, receding ================= -->
  <!-- nearest: mostly formed -->
  <g>
    <ellipse cx="782" cy="512" rx="74" ry="13" fill="url(#groundGlow)"/>
    <path d="M742,512 C752,440 760,392 766,352 C780,392 794,450 806,512 Z" fill="url(#wisp)" opacity="0.5" filter="url(#soft8)"/>
    <g transform="translate(722,348) scale(0.7)" opacity="0.96">
      <use href="#apprentice"/>
    </g>
  </g>

  <!-- middle: half-materialized -->
  <g>
    <ellipse cx="982" cy="500" rx="52" ry="9" fill="url(#groundGlow)" opacity="0.8"/>
    <path d="M958,500 C964,452 970,418 974,392 C984,420 992,460 998,500 Z" fill="url(#wisp)" opacity="0.45" filter="url(#soft8)"/>
    <g transform="translate(936,390) scale(0.47)" opacity="0.74">
      <use href="#apprentice"/>
    </g>
  </g>

  <!-- farthest: dissolving into motes -->
  <g>
    <ellipse cx="1136" cy="492" rx="36" ry="7" fill="url(#groundGlow)" opacity="0.6"/>
    <path d="M1120,492 C1124,460 1128,438 1130,420 C1138,440 1144,468 1148,492 Z" fill="url(#wisp)" opacity="0.4" filter="url(#soft8)"/>
    <g transform="translate(1104,418) scale(0.31)" opacity="0.5">
      <use href="#apprentice"/>
    </g>
  </g>

  <!-- materialization motes -->
  <g fill="#e9d5ff" filter="url(#soft)">
    <circle cx="560" cy="78" r="2.6" opacity="0.9"/>
    <circle cx="646" cy="92" r="1.9" opacity="0.7"/>
    <circle cx="716" cy="148" r="2.2" opacity="0.8"/>
    <circle cx="756" cy="240" r="1.8" opacity="0.7"/>
    <circle cx="700" cy="110" r="1.4" opacity="0.5"/>
    <circle cx="836" cy="166" r="1.7" opacity="0.55"/>
    <circle cx="902" cy="216" r="1.5" opacity="0.5"/>
    <circle cx="962" cy="270" r="1.3" opacity="0.45"/>
    <circle cx="1042" cy="290" r="1.2" opacity="0.4"/>
    <circle cx="1108" cy="334" r="1.1" opacity="0.35"/>
    <circle cx="770" cy="300" r="1.6" opacity="0.6"/>
    <circle cx="996" cy="360" r="1.2" opacity="0.4"/>
    <circle cx="1142" cy="400" r="1.0" opacity="0.35"/>
    <circle cx="806" cy="404" r="1.4" opacity="0.5"/>
    <circle cx="1010" cy="430" r="1.1" opacity="0.4"/>
    <circle cx="1160" cy="446" r="0.9" opacity="0.3"/>
  </g>

  <!-- ================= atmosphere ================= -->
  <ellipse cx="430" cy="112" rx="180" ry="120" fill="url(#orbHalo)" opacity="0.5" filter="url(#soft18)"/>
  <rect y="430" width="1280" height="130" fill="url(#mist)"/>
  <ellipse cx="240" cy="540" rx="420" ry="46" fill="#9d8fd0" opacity="0.07" filter="url(#soft18)"/>
  <ellipse cx="880" cy="548" rx="520" ry="52" fill="#9d8fd0" opacity="0.06" filter="url(#soft18)"/>
  <rect width="1280" height="560" fill="url(#vignette)"/>
</svg>
