# Pushing a version tag (v0.2.0, ...) publishes a GitHub release whose
# notes are that version's section of CHANGELOG.md, with the built
# wheel and sdist attached. The tag must match the package version, and
# the changelog must have a section for it, or the release stops before
# anything is published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check tag, version and changelog agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "tag v$tag doesn't match pyproject version $pkg"; exit 1
          fi
          python scripts/release_notes.py --check "$tag"
      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "conjure $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
