[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combinator"
version = "0.1.0"
description = "Agentic functional programming: a multi-agent harness over orchestral with recursive spawn, addressable mailboxes, and FP-style combinators."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tony Menzo" }]
dependencies = [
    "orchestral-ai>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "sympy>=1.12",
]

[project.scripts]
combinator = "combinator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
