[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conjure"
version = "0.1.0"
description = "Agentic functional programming: a multi-agent harness over orchestral with recursive spawn, addressable mailboxes, and FP-style combinators."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tony Menzo" }]
dependencies = [
    "orchestral-ai>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "libtmux>=0.39",
    "textual>=0.40",
    # uvloop powers the runtime's shared sync-from-async bridge — 2-4×
    # faster than stock asyncio for the SDK's IO-heavy workload. POSIX
    # only; conjure already won't run on Windows (daemonize forks).
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
env = [
    "python-dotenv>=1.0",
]
# Enables ``engine: "claude_agent"`` in AgentSpec — agents that run as
# claude-agent-sdk sessions with Claude Code's full tool surface.
claude_agent = [
    "claude-agent-sdk>=0.2",
]
test = [
    "pytest>=7",
    "sympy>=1.12",
    "python-dotenv>=1.0",
]

[project.scripts]
conjure = "conjure.cli:main"
conjure-main = "conjure.main_window:main"
conjure-chat = "conjure.chat:main"
conjure-files = "conjure.files_view:main"
conjure-mcp = "conjure.mcp_bridge:main"
conjure-render = "conjure.render:main"
conjure-input = "conjure.cli_input:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conjure = ["system_prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
