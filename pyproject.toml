[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# Named conjure (distribution conjure-agents) before 0.3.0.
name = "hylo"
version = "0.3.2"
description = "Agentic functional programming: a multi-agent runtime built on three primitives — recursive spawning, addressable mailboxes, and capability passing — with FP-style combinators on top."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tony Menzo" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "agents",
    "multi-agent",
    "llm",
    "actor-model",
    "functional-programming",
    "orchestration",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "orchestral-ai>=1.4",
    # orchestral.mcp.server imports ``mcp`` but orchestral-ai 1.4.0
    # doesn't declare it; hylo-mcp needs it, so declare it here.
    "mcp>=1.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    # uvloop powers the runtime's shared sync-from-async bridge — 2-4×
    # faster than stock asyncio for the SDK's IO-heavy workload. POSIX
    # only; hylo already won't run on Windows (daemonize forks).
    "uvloop>=0.19; sys_platform != 'win32'",
]

[project.optional-dependencies]
# The interactive cockpit: ``hylo run`` (tmux session, one window
# per agent) and the textual apps it launches (hylo-main,
# hylo-chat, hylo-files). The core library and ``hylo repl``
# work without it.
ui = [
    "libtmux>=0.39",
    "textual>=0.40",
]
env = [
    "python-dotenv>=1.0",
]
# Enables ``engine: "claude_agent"`` in AgentSpec — agents that run as
# claude-agent-sdk sessions with Claude Code's full tool surface.
claude_agent = [
    "claude-agent-sdk>=0.2",
]
# Lets agents curate toolbase toolkits for the agents they spawn
# (``Spawn(toolkits=...)``, ``ToolCatalog``, ``GrantToolkits``). toolbase
# itself requires Python >= 3.12; on older interpreters the extra
# installs nothing and toolkit grants are refused.
toolbase = [
    "toolbase>=0.16; python_version >= '3.12'",
]
test = [
    "pytest>=7",
    "sympy>=1.12",
    "python-dotenv>=1.0",
    # The suite covers the UI layer too (test_tmux_session, test_ui).
    "libtmux>=0.39",
    "textual>=0.40",
]

[project.urls]
Repository = "https://github.com/tonymenzo/hylo"
Changelog = "https://github.com/tonymenzo/hylo/blob/main/CHANGELOG.md"

[project.scripts]
hylo = "hylo.cli:main"
# The old command, kept for one release; it says to use hylo.
conjure = "hylo.cli:legacy_main"
hylo-main = "hylo.main_window:main"
hylo-chat = "hylo.chat:main"
hylo-files = "hylo.files_view:main"
hylo-mcp = "hylo.mcp_bridge:main"
hylo-render = "hylo.render:main"
hylo-input = "hylo.cli_input:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hylo = ["system_prompts/*.md", "py.typed", "web/static/*", "web/static/vendor/katex/*", "web/static/vendor/katex/fonts/*", "web/static/vendor/highlight/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
