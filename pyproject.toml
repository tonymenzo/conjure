[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "combinator"
version = "0.1.0"
description = "Agentic functional programming: a multi-agent harness over orchestral with recursive spawn, addressable mailboxes, and FP-style combinators."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Tony Menzo" }]
dependencies = [
    "orchestral-ai>=1.4",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "libtmux>=0.39",
    "textual>=0.40",
]

[project.optional-dependencies]
env = [
    "python-dotenv>=1.0",
]
test = [
    "pytest>=7",
    "sympy>=1.12",
    "python-dotenv>=1.0",
]

[project.scripts]
combinator = "combinator.cli:main"
combinator-main = "combinator.main_window:main"
combinator-chat = "combinator.chat:main"
combinator-meta = "combinator.meta:main"
combinator-inbox = "combinator.inbox_view:main"
combinator-render = "combinator.render:main"
combinator-input = "combinator.cli_input:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
