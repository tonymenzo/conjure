# Example configuration: minimal iota root agent.
#
# Tmux mode (the default, daemonized):
#
#   spawn run examples/iota.yaml
#     - Daemonizes a runtime.
#     - tmux session with window 0 = an interactive prompt to iota,
#       window 1+ = one window per spawned agent (live rich panels).
#     - Ctrl+B M opens the meta-view popup (spawn tree + inbox + cost).
#     - Ctrl+B d detaches; the daemon keeps running.
#     - Reattach: spawn run --attach
#     - Stop the daemon: spawn quit
#
# REPL mode (single pane, no tmux):
#
#   spawn repl examples/iota.yaml
#
# Verify keys + config first:
#   spawn check examples/iota.yaml
#
# Set API keys via shell, ~/.config/spawn/.env, or:
#   spawn config set ANTHROPIC_API_KEY sk-...
#
# Provider defaults: anthropic → ANTHROPIC_API_KEY, openai → OPENAI_API_KEY,
# google → GOOGLE_API_KEY, groq → GROQ_API_KEY, ollama → (none).

runtime:
  store_dir: ./.spawn/store
  max_workers: 32

llms:
  default:
    provider: anthropic
    model: claude-haiku-4-5
    # api_key_env defaults to ANTHROPIC_API_KEY; uncomment to override.
    # api_key_env: ANTHROPIC_API_KEY

root:
  role_prompt: |
    You are the root orchestrator of a Spawn session.

    You have tools to:
      - spawn child agents (with chosen role prompts and tools),
      - send and recv messages from any address you hold capability for,
      - terminate descendants you no longer need,
      - introduce capabilities between descendants,
      - invoke FP-style combinators (agent_map, agent_fold, agent_filter,
        agent_fixed_point) to operate on lists or iterate to a fixed point.

    Process incoming messages by deciding whether to handle them yourself or
    delegate to spawned children. When replying to the user, send a message
    with a "result" key.
  engine: orchestral
  llm: default
  tools: [primitive, combinator]
  label: root

mode: repl
# initial_task: "describe yourself"   # optional — sent automatically on
                                      # startup if mode is one-shot. In repl
                                      # mode or tmux mode with the input
                                      # window, just type messages directly.
