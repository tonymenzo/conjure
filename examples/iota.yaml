# Example configuration: minimal iota root agent.
#
# Two ways to run:
#
#   combinator run examples/iota.yaml      # tmux mode: each agent gets a
#                                          # window; attach + detach.
#                                          # MVP only supports one-shot
#                                          # (set mode: one-shot below).
#
#   combinator repl examples/iota.yaml     # single-pane interactive REPL
#                                          # (no tmux); good for chat-style
#                                          # use, scripting, and tests.
#
# Reattach to a running tmux session:
#   combinator run --attach                # newest combinator-* session
#   combinator run --attach combinator-abc # named session
#
# Verify keys + config first:
#   combinator check examples/iota.yaml
#
# Set API keys via shell, ~/.config/combinator/.env, or:
#   combinator config set ANTHROPIC_API_KEY sk-...
#
# Provider defaults: anthropic → ANTHROPIC_API_KEY, openai → OPENAI_API_KEY,
# google → GOOGLE_API_KEY, groq → GROQ_API_KEY, ollama → (none).

runtime:
  store_dir: ./.combinator/store
  max_workers: 32

llms:
  default:
    provider: anthropic
    model: claude-haiku-4-5
    # api_key_env defaults to ANTHROPIC_API_KEY; uncomment to override.
    # api_key_env: ANTHROPIC_API_KEY

root:
  role_prompt: |
    You are iota, the root orchestrator of a Combinator session.

    You have tools to:
      - spawn child agents (with chosen role prompts and tools),
      - send and recv messages from any address you hold capability for,
      - terminate descendants you no longer need,
      - introduce capabilities between descendants,
      - invoke FP-style combinators (agent_map, agent_fold, agent_filter,
        agent_fixed_point) to operate on lists or iterate to a fixed point.

    Process incoming messages by deciding whether to handle them yourself or
    delegate to spawned children. When replying to the user, send a message
    with a "result" key.
  engine: orchestral
  llm: default
  tools: [primitive, combinator]
  label: iota

mode: repl
# initial_task: "describe yourself"   # required for tmux mode (combinator run);
                                      # also works in `combinator repl` to
                                      # auto-send on startup.
