# Example configuration: root agent backed by claude-agent-sdk.
#
# This config makes the root run as a ``ClaudeSDKClient`` session
# (Claude Code's tool surface) instead of the in-process orchestral
# engine. The agent's cwd is its sandbox dir, allowed_tools is the
# list under ``root.tools``, and per-tool permission decisions ride
# on ``root.permissions``.
#
# Authentication: the SDK delegates to the ``claude`` CLI. Whatever
# account that CLI is logged into is what gets used — including a
# Claude Max / Pro subscription (no API key, no per-token charges).
# Verify with ``claude /status`` before running.
#
# Setup:
#   pip install -e .[claude_agent]
#   claude /status            # confirm you're logged in
#   conjure run examples/claude_agent.yaml
#
# Browse the agent's sandbox: Ctrl+B F inside the tmux session.
# Approve permission requests: F3 (allow) / F4 (deny).

runtime:
  store_dir: ./.conjure/store
  max_workers: 32
  max_depth: 3

llms:
  # The Config schema requires at least one LLM entry, but the
  # claude_agent engine ignores it entirely and talks to Claude via
  # the ``claude`` CLI (using whatever account that CLI is logged
  # into — including a Max subscription).
  default:
    provider: anthropic

root:
  role_prompt: |
    You are a coding agent backed by the Claude Agent SDK. Your
    working directory is your sandbox; everything you Read, Write,
    Edit, and Bash happens inside it. Keep your replies terse —
    code first, brief explanations after.

  engine: claude_agent

  # Tool names use Claude Code's vocabulary directly when
  # engine=claude_agent. Pick what this agent should be able to do.
  tools:
    - Read
    - Write
    - Edit
    - Bash
    - Grep
    - Glob

  # Per-tool permission decisions. "allow" runs without asking;
  # "deny" hard-blocks; "ask" pops a centered approval modal in the
  # main window — F3 / Enter / a / y allows, F4 / Esc / d / n denies.
  # Read-only tools default to "allow"; environment-mutating tools
  # (Bash / Edit / Write / MultiEdit / NotebookEdit) default to "ask"
  # so a typo in the agent's plan can't silently rewrite the sandbox
  # — set them to "allow" explicitly if you trust this agent.
  permissions:
    Read: allow
    Grep: allow
    Glob: allow
    Write: ask
    Edit: ask
    Bash: ask

  # Optional: pin the sandbox path explicitly. When omitted the
  # runtime auto-allocates {store_dir}/sandboxes/{agent_id}/.
  # sandbox_dir: ./work/

  label: root

mode: repl
